name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate eval cases
        run: python3 evals/run_evals.py --validate-only

      - name: Validate shell scripts
        run: bash -n install.sh hooks/vlt-post-edit.sh

      - name: Validate JSON and TOML manifests
        run: |
          python3 -c '
          import glob, json, tomllib
          for p in glob.glob("**/*.json", recursive=True) + glob.glob(".*/**/*.json", recursive=True):
              with open(p) as f:
                  json.load(f)
              print("JSON OK:", p)
          for p in glob.glob("**/*.toml", recursive=True) + glob.glob(".*/**/*.toml", recursive=True):
              with open(p, "rb") as f:
                  tomllib.load(f)
              print("TOML OK:", p)
          '
